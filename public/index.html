<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>CardHub - Login</title>
</head>
<body>

    <main>
<!---------------------------------------------->
            <!-- ==> Login <== -->
        <section id="loginSection">

            <h1>CardHub</h1>
            <h2>Login</h2>

            <form id="loginForm">
                <div>
                    <label for="username">Usuário</label>

                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        required
                    >
                </div>
                <div>
                    <label for="password">Senha</label>

                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        required
                    >
                </div>

                <button type="submit">
                    Entrar
                </button>
            </form>

            <p id="message"></p>
        </section>
<!---------------------------------------------->
            <!-- ==> Dashboard <== -->
        <section id="dashboardSection">
            <!-- ==> Header <== -->
            <header id="dashboardHeader">

                <img src="images/cardhub.jpg" alt="CardHub">

                <button type="button" id="logoutButton">
                    Sair
                </button>

            </header>
<!---------------------------------------------->
            <!-- ==> GameSelector <== -->
            <div id="gameSelector">

                <button type="button" data-game="mtg">

                    <div class="gameImage">
                        <img src="images/mtg.jpg" alt="Magic: The Gathering">
                    </div>

                    <span>
                        Magic: The Gathering
                    </span>
                </button>

                <button type="button" data-game="ptcg">

                    <div class="gameImage">
                        <img src="images/ptcg.jpg" alt="Pokémon">
                    </div>

                    <span>
                        Pokémon
                    </span>
                </button>

                <button type="button" data-game="ygo">

                    <div class="gameImage">
                        <img src="images/ygo.jpg" alt="Yu-Gi-Oh!">
                    </div>

                    <span>
                        Yu-Gi-Oh!
                    </span>
                </button>
            </div>
<!---------------------------------------------->
            <!-- ==> EditionSelector <== -->
            <div id="catalogControls">
                <div id="catalogFilters">

                    <label for="catalogEdition">
                        Edição:
                    </label>

                    <select id="catalogEdition" disabled>

                        <option value="">
                            Selecione primeiro um jogo
                        </option>
                    </select>
                </div>

<!---------------------------------------------->
            <!-- ==> CardInsert <== -->
                <div id="cardActions">
                    <button type="button" id="addCardButton">
                        <span class="addText">Adicionar Carta</span>
                        <span class="addIcon">+</span>
                    </button>
                </div>
            </div>
<!---------------------------------------------->
            <!-- ==> CardEdit <== -->
            <div id="editCardForm">
            <!-- Começo do Modal -->
            <div>

                <button type="button" id="closeEditButton">
                    X
                </button>

                <h2>Editar Carta</h2>

                <form id="cardEditForm">

                    <input type="hidden" id="editCardId">

                    <div>
                        <label for="editNameEn">Nome em Inglês</label>
                        <input type="text" id="editNameEn" required>
                    </div>

                    <div>
                        <label for="editNamePt">Nome em Português</label>
                        <input type="text" id="editNamePt">
                    </div>

                    <div>
                        <label for="editGame">Jogo</label>
                        <select id="editGame" required>
                            <option value="">
                                Selecione um jogo
                            </option>

                            <option value="mtg">
                                Magic: The Gathering
                            </option>

                            <option value="ptcg">
                                Pokémon
                            </option>

                            <option value="ygo">
                                Yu-Gi-Oh!
                            </option>
                        </select>
                    </div>

                    <div>
                        <label for="editEdition">Edição</label>
                        <select id="editEdition" required disabled>
                            <option value="">
                                Selecione primeiro um jogo
                            </option>
                        </select>

                        <span id="editionId"></span>
                    </div>

                    <div>
                        <label for="editImage">Imagem</label>
                        <input type="text" id="editImage">
                    </div>

                    <div>
                        <label for="editRarity">Raridade</label>
                        <select id="editRarity" required disabled>
                            <option value="">Selecione primeiro um jogo</option>
                        </select>
                    </div>

                    <button type="submit">
                        Salvar alterações
                    </button>

                    <button type="button" id="cancelEditButton">
                        Cancelar
                    </button>

                </form>
            </div>
            <!-- Fim do Modal -->
            </div>

            <div id="cardsList">
            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
